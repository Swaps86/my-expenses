<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Expenses</title>
<style>
:root{--bg:#F6F7F4;--card:#fff;--ink:#14201A;--mut:#5A6660;--acc:#1F7A4D;--on:#fff;--soft:#DCEFE4;--line:#E3E7E2;--dark:#14201A;--bad:#B23A48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--card:#19211D;--ink:#EEF2EE;--mut:#A3AEA7;--acc:#4BB886;--on:#06130C;--soft:#1E3328;--line:#2A342F;--dark:#26332C;--bad:#F08A96}}
:root[data-theme="dark"]{--bg:#0F1512;--card:#19211D;--ink:#EEF2EE;--mut:#A3AEA7;--acc:#4BB886;--on:#06130C;--soft:#1E3328;--line:#2A342F;--dark:#26332C;--bad:#F08A96}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:480px;margin:0 auto;padding:12px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}input{font:inherit;color:var(--ink)}
.c{background:var(--card);border-radius:20px;padding:16px;margin-top:12px}
.hero{background:var(--acc);color:var(--on);border-radius:22px;padding:18px 20px;margin-top:8px}
.big{font-size:38px;font-weight:700}.mut{color:var(--mut);font-size:13px}.hero .mut{color:inherit;opacity:.85}
.bar{height:8px;border-radius:4px;background:rgba(127,127,127,.25);margin-top:10px}.bar i{display:block;height:8px;border-radius:4px;background:var(--acc)}.hero .bar i{background:var(--on)}
.top{display:flex;align-items:center;justify-content:space-between}.top b{font-size:17px}
.ib{border:0;background:none;font-size:24px;width:44px;height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:0 16px;height:44px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn{border:0;background:var(--acc);color:var(--on);border-radius:26px;height:50px;font-weight:700;width:100%;font-size:16px}
.sm{border:0;background:var(--acc);color:var(--on);border-radius:14px;padding:0 18px;height:44px}
.in{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;box-sizing:border-box;width:100%}
.row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .g{flex:1}.row .t{font-weight:500}.x{border:0;background:none;color:var(--mut);height:44px;padding:0 8px}
.cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cd{flex:none;width:140px;border-radius:16px;padding:12px 14px;background:var(--dark);color:#fff;box-sizing:border-box}
.add{flex:none;width:96px;border:2px dashed var(--mut);background:none;border-radius:16px}
h3{margin:18px 0 4px;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:0 8px env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;height:56px;color:var(--mut)}nav button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:30px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-sizing:border-box}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal button{border:0;background:none;border-radius:12px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal button.on{background:var(--acc);color:var(--on)}.cal i{width:5px;height:5px;border-radius:50%;background:var(--acc)}.cal button.on i{background:var(--on)}.cal i.z{background:none}
.h{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--mut)}.h b{color:var(--ink)}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.mb{display:flex;align-items:flex-end;height:110px;gap:6px;margin-top:8px}.mb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);gap:4px}.mb i{width:22px;border-radius:6px 6px 0 0;background:var(--line);display:block}.mb .cur i{background:var(--acc)}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:13px}
.cp{text-align:center;font-size:11px;color:var(--mut);margin-top:18px}@media print{nav,.fab,.sm,.chip,#sheet{display:none!important}}
.strip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--soft);border-radius:16px;padding:10px 14px;margin-top:8px;color:var(--ink)}.strip .g{flex:1;display:flex;flex-direction:column}
</style></head><body>
<div id="app"></div><div id="sheet"></div>
<script>
var K="expense_v1",S={defaultAmount:null,monthAmounts:{},cards:[],items:["Food","Milk","Other"],tx:[],fixed:[],paid:{},pin:null,lockOn:false};
try{var r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var inr=function(n){return "\u20B9"+Math.round(n).toLocaleString("en-IN")};
var pad=function(n){return String(n).padStart(2,"0")};
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var tab="home",ym=today().slice(0,7),selDate=today(),vals={},draft=null,setup=null;
function mname(y){var p=y.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"})}
function shift(y,d){var p=y.split("-"),x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+"-"+pad(x.getMonth()+1)}
function budget(y){return S.monthAmounts[y]!=null?S.monthAmounts[y]:S.defaultAmount}
function mtx(y){return S.tx.filter(function(t){return t.date.slice(0,7)===y})}
function stats(y){var cash=0,by={},items={};mtx(y).forEach(function(t){if(t.pay==="cash")cash+=t.amt;else by[t.pay]=(by[t.pay]||0)+t.amt;items[t.item]=(items[t.item]||0)+t.amt});return{cash:cash,by:by,items:items}}
function nav(){return '<div class="top"><button class="ib" data-act="shift" data-v="-1" aria-label="Previous month">&#8249;</button><b>'+mname(ym)+'</b><button class="ib" data-act="shift" data-v="1" aria-label="Next month">&#8250;</button></div>'}
function txRow(t){return '<div class="row"><div class="g"><div class="t">'+esc(t.item)+'</div><div class="mut">'+(t.pay==="cash"?"Cash":esc(t.pay))+' &middot; '+t.date.slice(8)+'/'+t.date.slice(5,7)+'</div></div><b>-'+inr(t.amt)+'</b><button class="x" data-act="del" data-v="'+t.id+'" aria-label="Delete">&#215;</button></div>'}
function home(){var b=budget(ym),st=stats(ym),h;
 if(b==null)h='<div class="hero"><div class="mut">No amount set for this month</div><button class="chip" style="margin-top:12px" data-act="setup">Set amount</button></div>';
 else{var left=b-st.cash,p=Math.min(100,Math.max(0,st.cash/b*100));h='<div class="hero"><div class="mut">Cash left</div><div class="big">'+inr(left)+'</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="mut" style="margin-top:8px">'+inr(st.cash)+' spent of '+inr(b)+' &middot; <button class="x" style="color:inherit;text-decoration:underline;height:auto;padding:0" data-act="setup">change</button></div></div>'}
 var cs=S.cards.map(function(c){return '<div class="cd"><div>'+esc(c)+'</div><div style="font-size:20px;font-weight:700;margin-top:8px">'+inr(st.by[c]||0)+'</div></div>'}).join("");
 var rec=mtx(ym).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id}).slice(0,6).map(txRow).join("")||'<div class="mut" style="padding:14px 0">No purchases yet. Tap + to add.</div>';
 return nav()+h+'<h3>Credit cards</h3><div class="cards">'+cs+'<button class="add" data-act="tab" data-v="manage">+ Add card</button></div><h3>Recent</h3><div class="c" style="margin-top:6px;padding:4px 16px">'+rec+'</div>'}
function days(){var p=ym.split("-"),n=new Date(+p[0],+p[1],0).getDate(),off=(new Date(+p[0],+p[1]-1,1).getDay()+6)%7,has={},g='';
 mtx(ym).forEach(function(t){has[t.date]=1});
 var cal='<div class="cal mut">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return"<span>"+d+"</span>"}).join("")+"</div><div class=\"cal\">";
 for(var i=0;i<off;i++)cal+="<span></span>";
 for(var d=1;d<=n;d++){var ds=ym+"-"+pad(d);cal+='<button class="'+(selDate===ds?"on":"")+'" data-act="day" data-v="'+ds+'" aria-label="'+d+'">'+d+'<i class="'+(has[ds]?"":"z")+'"></i></button>'}
 cal+="</div>";
 var list=mtx(ym).filter(function(t){return!selDate||t.date===selDate}),by={};
 list.forEach(function(t){(by[t.date]=by[t.date]||[]).push(t)});
 Object.keys(by).sort().reverse().forEach(function(d){var tot=by[d].reduce(function(s,t){return s+t.amt},0);var dt=new Date(d+"T00:00:00");g+='<div class="h"><b>'+dt.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})+'</b><span>Total '+inr(tot)+'</span></div><div class="c" style="margin-top:6px;padding:4px 16px">'+by[d].map(txRow).join("")+'</div>'});
 if(!g)g='<div class="mut" style="margin-top:14px">No purchases on this date.</div>';
 return nav()+'<div class="c" style="margin-top:6px;padding:10px 8px">'+cal+'</div><div style="margin-top:10px"><button class="chip'+(selDate?"":" on")+'" data-act="all">All dates this month</button></div>'+g}
function report(){var st=stats(ym),b=budget(ym),card=0,k;for(k in st.by)card+=st.by[k];
 var its=Object.keys(st.items).sort(function(a,b){return st.items[b]-st.items[a]}),mx=its.length?st.items[its[0]]:1;
 var ih=its.map(function(i){return '<div style="margin-top:12px"><div class="top"><span>'+esc(i)+'</span><b>'+inr(st.items[i])+'</b></div><div class="bar" style="margin-top:6px"><i style="width:'+st.items[i]/mx*100+'%"></i></div></div>'}).join("")||'<div class="mut" style="margin-top:10px">No data</div>';
 var ch=S.cards.map(function(c){return '<div class="row"><span class="g">'+esc(c)+'</span><b>'+inr(st.by[c]||0)+'</b></div>'}).join("")||'<div class="mut" style="padding:10px 0">No cards</div>';
 var m=[],i,mv=1;for(i=5;i>=0;i--){var y=shift(ym,-i);m.push([y,stats(y).cash]);mv=Math.max(mv,stats(y).cash)}
 var bars=m.map(function(x){return '<div class="'+(x[0]===ym?"cur":"")+'"><i style="height:'+Math.max(2,x[1]/mv*80)+'px"></i>'+new Date(+x[0].slice(0,4),+x[0].slice(5)-1,1).toLocaleString("en-IN",{month:"short"})+'</div>'}).join("");
 return nav()+'<div style="display:flex;gap:10px;margin-top:8px"><div class="hero" style="flex:1;margin:0"><div class="mut">Cash spent</div><div style="font-size:24px;font-weight:700">'+inr(st.cash)+'</div><div class="mut">'+(b==null?"no amount set":"of "+inr(b))+'</div></div><div class="hero" style="flex:1;margin:0;background:var(--dark);color:#fff"><div class="mut">Card spent</div><div style="font-size:24px;font-weight:700">'+inr(card)+'</div><div class="mut">'+S.cards.length+' cards</div></div></div><div class="c"><b>Last 6 months (cash)</b><div class="mb">'+bars+'</div></div><div class="c"><b>By item</b>'+ih+'</div><div class="c" style="padding:12px 16px"><b>By card</b>'+ch+'</div>'}
function manage(){var l=function(a,act){return a.map(function(x){return '<div class="row"><span class="g">'+esc(x)+'</span><button class="x" data-act="'+act+'" data-v="'+esc(x)+'">Remove</button></div>'}).join("")};
 return '<div class="top"><b style="font-size:22px">Cards and items</b></div><div class="c"><b>Credit cards</b>'+l(S.cards,"rmcard")+'<div style="display:flex;gap:8px;margin-top:10px"><input class="in" data-in="mcard" placeholder="Card name"><button class="sm" data-act="mcard">Add</button></div></div><div class="c"><b>Items</b>'+l(S.items,"rmitem")+'<div style="display:flex;gap:8px;margin-top:10px"><input class="in" data-in="mitem" placeholder="Item name"><button class="sm" data-act="mitem">Add</button></div></div>'}
function render(){$("#app").innerHTML=(tab==="home"?home():tab==="days"?days():tab==="report"?report():tab==="fixed"?fixedv():manage())+(tab==="home"||tab==="days"?'<button class="fab" data-act="add" aria-label="Add purchase">+</button>':"")+'<nav>'+[["home","Home"],["days","Days"],["report","Report"],["fixed","Fixed"],["manage","Manage"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</nav>'}
function sheet(){var s=$("#sheet");if(fx||pp||lockUI||remOpen||dsh)return sheet2(s);
 if(setup){s.innerHTML='<div class="ov"><div class="sheet"><b style="font-size:20px">Set your amount</b><div class="mut" style="margin-top:4px">How much cash do you have to spend?</div><label for="sa">Amount</label><input id="sa" class="in" data-in="sa" inputmode="decimal" value="'+esc(vals.sa||"")+'" placeholder="20000" style="font-size:28px;height:60px"><label>Use this amount for</label><div class="chips"><button class="chip'+(setup.mode==="once"?" on":"")+'" data-act="smode" data-v="once">Only '+mname(ym).split(" ")[0]+'</button><button class="chip'+(setup.mode==="default"?" on":"")+'" data-act="smode" data-v="default">Every month (default)</button></div>'+(setup.err?'<div class="err">'+setup.err+'</div>':"")+'<div style="display:flex;gap:8px;margin-top:18px"><button class="chip" data-act="close">Cancel</button><button class="btn" data-act="ssave">Save</button></div></div></div>';return}
 if(!draft){s.innerHTML="";return}
 var d=draft,ch=function(a,key,cur){return a.map(function(x){return '<button class="chip'+(cur===x?" on":"")+'" data-act="'+key+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join("")};
 var left=budget(ym)==null?null:budget(ym)-stats(ym).cash-(d.pay==="cash"&&+vals.amt>0?+vals.amt:0);
 s.innerHTML='<div class="ov"><div class="sheet"><div class="top"><b style="font-size:20px">New purchase</b><button class="ib" data-act="close" aria-label="Close">&#215;</button></div><label for="am">Amount</label><input id="am" class="in" data-in="amt" inputmode="decimal" value="'+esc(vals.amt||"")+'" placeholder="0" style="font-size:28px;height:60px"><label>What did you buy?</label><div class="chips">'+ch(S.items,"pitem",d.item)+'<button class="chip" data-act="tnew">+ New item</button></div>'+(d.newItem?'<div style="display:flex;gap:8px;margin-top:8px"><input class="in" data-in="ni" placeholder="Item name" value="'+esc(vals.ni||"")+'"><button class="sm" data-act="sitem">Add</button></div>':"")+'<label>Paid with</label><div class="chips"><button class="chip'+(d.pay==="cash"?" on":"")+'" data-act="ppay" data-v="cash">Cash</button>'+ch(S.cards,"ppay",d.pay)+'<button class="chip" data-act="tcard">+ Add card</button></div>'+(d.newCard?'<div style="display:flex;gap:8px;margin-top:8px"><input class="in" data-in="nc" placeholder="Card name" value="'+esc(vals.nc||"")+'"><button class="sm" data-act="scard">Add</button></div>':"")+'<label for="dt">Date</label><input id="dt" type="date" class="in" data-in="dt" value="'+d.date+'"><div class="c" style="background:var(--soft);margin-top:14px;padding:12px 14px;font-size:14px">'+(d.pay==="cash"?"This will be deducted from your cash."+(left!=null?" Cash left after this: <b>"+inr(left)+"</b>":""):"Paid by card, so cash stays the same. Amount is added to "+esc(d.pay)+".")+'</div>'+(d.err?'<div class="err">'+d.err+'</div>':"")+'<button class="btn" style="margin-top:16px" data-act="save">Save</button></div></div>'}
S.fixed=S.fixed||[];S.paid=S.paid||{};
var fx=null,pp=null,lockUI=false,pinBuf="",pinErr=0,rp="month",_r=report,_h=home,_m=manage,_rd=render;
function dleft(d){return Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)}
function dueOf(f,y){if(f.type==="once")return f.date;var p=y.split("-"),n=new Date(+p[0],+p[1],0).getDate();return y+"-"+pad(Math.min(f.day,n))}
function paidF(f,y){return !!S.paid[f.type==="once"?f.id:f.id+"|"+y]}
function pending(){var o=[],y=today().slice(0,7);S.fixed.forEach(function(f){var d=dueOf(f,y);if(paidF(f,y))return;var n=dleft(d),m=Math.max.apply(null,(f.remind||[]).concat([1]));if(n<=m)o.push([f,d,n])});return o}

function frow(f,y){var d=dueOf(f,y),pd=paidF(f,y);return '<div class="row"><div class="g"><div class="t">'+esc(f.name)+'</div><div class="mut">'+(f.type==="monthly"?"Every month on "+f.day:"One time "+d.slice(8)+"/"+d.slice(5,7)+"/"+d.slice(0,4)+(pd?"":" &middot; in "+dleft(d)+" days"))+'</div></div><b>'+inr(f.amt)+'</b>'+(pd?'<span class="mut" style="width:44px;text-align:center">Paid</span>':'<button class="sm" data-act="payopen" data-v="'+f.id+'">Pay</button>')+'<button class="x" data-act="fxdel" data-v="'+f.id+'" aria-label="Remove">&#215;</button></div>'}
function fixedv(){var mo=S.fixed.filter(function(f){return f.type==="monthly"}),on=S.fixed.filter(function(f){return f.type==="once"}).sort(function(a,b){return a.date<b.date?-1:1}),t=0,p=0,no='<div class="mut" style="padding:14px 0">None yet</div>';mo.forEach(function(f){t+=f.amt;if(paidF(f,ym))p+=f.amt});
return nav()+'<div class="hero"><div class="mut">Fixed this month</div><div class="big">'+inr(t)+'</div><div class="mut">Paid '+inr(p)+' &middot; Pending '+inr(t-p)+'</div></div><h3>Every month</h3><div class="c" style="margin-top:6px;padding:4px 16px">'+(mo.map(function(f){return frow(f,ym)}).join("")||no)+'</div><h3>One-time payments</h3><div class="c" style="margin-top:6px;padding:4px 16px">'+(on.map(function(f){return frow(f,ym)}).join("")||no)+'</div><button class="btn" style="margin-top:16px" data-act="fxadd">+ Add payment</button>'}
function sheet2a(s){var pays=function(k,cur){return ["cash"].concat(S.cards).map(function(c){return '<button class="chip'+(cur===c?" on":"")+'" data-act="'+k+'" data-v="'+esc(c)+'">'+(c==="cash"?"Cash":esc(c))+'</button>'}).join("")};
if(lockUI){var d="",k="";for(var i=0;i<4;i++)d+='<span style="width:16px;height:16px;border-radius:50%;box-sizing:border-box;'+(i<pinBuf.length?"background:var(--acc)":"border:2px solid var(--mut)")+'"></span>';["1","2","3","4","5","6","7","8","9","","0","<"].forEach(function(x){k+=x===""?"<span></span>":'<button class="chip" style="height:60px;font-size:22px;border-radius:30px" data-act="pin" data-v="'+x+'">'+(x==="<"?"&#9003;":x)+'</button>'});
